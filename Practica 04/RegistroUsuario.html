<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>MecaGest</h1>
        <h2>Registro De Nuevos Usuarios-250953</h2>
        <p>Complete los cambios para solicitar una cuenta en el sistema.</p>
    </header>

    <main>
        <form bindsubmit=""method="">

            <fieldset>

            <legend>Datos Personales</legend>
            
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="Juan Fernando" required>
            <br>

            <label for="apPaterno">Apellido Paterno:</label>
            <input type="text" id="apPaterno" placeholder="Hernandez" required>
            <br>

            <label for="apMaterno">Apellido Materno:</label>
            <input type="text" id="apMaterno" placeholder="Lopez" required>
            <br>

                        <label for="genero">Género:</label>
            <select id="genero">
                <option value="F"> Femenino </option>
                <option value="M"> Masculino </option>
                <option value="X"> Prefiero no decirlo </option>
            </select>

            <label for="fechaNacimiento">Fecha De Nacimiento:</label>
            <input type="date" id="fechaNacimiento" placeholder="Lopez" required>
            <br>
            </fieldset>

            <fieldset>
                <legend>Datos de Contacto</legend>
                
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" placeholder="250953@utxicotepec.edu.mx" required>
            <br>
        
            <label for="numTeléfonico">Numero Teléfonico:</label>
            <input type="tel" id="numTeléfonico" placeholder="776-115-50-22" required>
            <br>

            <label for="horarioContacto">Favor de contactar en el horario establecido:</label>
            <input type="time" id="horarioContactoInicio" placeholder="09:00" required> a
            <input type="time" id="horarioContactoFin" placeholder="18:00" required> 

            </fieldset>

            <fieldset>
                <legend>Dato  De Acceso</legend>

                <label for="user">Usuario:</label>
            <input type="text" id="user" placeholder="250953" required>
            <br>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="**********" required>
            <br>

            <label for="confirmarPassword">Confirmar Contraseña:</label>
            <input type="password" id="confirmarPassword" placeholder="**********" required>
            
            </fieldset>

            <fieldset>
                <legend>Datos De La Ubicación</legend>

                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" placeholder="Calle, Numero, Colonia, Ciudad, Estado, Código Postal" required>
                <br>

                <label for="pais">País:</label>
                <input type="text" id="pais" placeholder="México" required>
                <br>

                <label for="estado">Estado:</label>
                <input type="text" id="estado" placeholder="Ciudad de México" required>
                <br>

                 <label for="ciudad">Ciudad:</label>
                <input type="text" id="ciudad" placeholder="Ciudad de México" required>
                <br>

                 <label for="codigoPostal">Código Postal:</label>
                <input type="text" id="codigoPostal" placeholder="01234" required>

            </fieldset>

            <input type="submit" value="Enviar Solicitud">

        </form>
    </main>
</body>
</html>
